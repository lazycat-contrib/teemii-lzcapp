application:
  subdomain: teemii
  multi_instance: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://teemii-frontend:80/
  ingress:
    - protocol: tcp
      port: 3000
      service: teemii-backend
    - protocol: tcp
      port: 1555
      service: teemii-backend

services:
  teemii-frontend:
    # upstream: dokkaner/teemii-frontend:0.8.2
    image: docker.1ms.run/dokkaner/teemii-frontend:0.8.2
    environment:
      - VITE_APP_TITLE=Teemii
      - VITE_APP_PORT=80
    depends_on:
      - teemii-backend

  teemii-backend:
    # upstream: dokkaner/teemii-backend:0.8.2
    image: docker.1ms.run/dokkaner/teemii-backend:0.8.2
    environment:
      - EXPRESS_PORT=3000
      - SOCKET_IO_PORT=1555
    binds:
      - /lzcapp/var/data:/data
