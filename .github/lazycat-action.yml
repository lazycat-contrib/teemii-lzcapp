version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/teemii.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: teemii-frontend
build:
  run_buildscript: false
images:
  - id: teemii-frontend
    target: service
    service: teemii-frontend
    source: dokkaner/teemii-frontend
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
  - id: teemii-backend
    target: service
    service: teemii-backend
    source: dokkaner/teemii-backend
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
stores:
  official:
    enabled: false
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: Teemii
    summary: "一款精简的漫画阅读程序"
